let state={},timer=null,audio=null;
const STAGE_W=1280,STAGE_H=800;
function viewportSize(){
  const vv=window.visualViewport;
  return {w:vv?vv.width:window.innerWidth,h:vv?vv.height:window.innerHeight};
}
function scaleStage(){
  const {w,h}=viewportSize();
  const safe=8; // 给平板浏览器全屏边缘与系统手势区留少量余量
  const s=Math.min((w-safe)/STAGE_W,(h-safe)/STAGE_H,1.5);
  document.getElementById('stage').style.transform=`scale(${Math.max(.1,s)})`;
}
addEventListener('resize',scaleStage);
addEventListener('orientationchange',()=>setTimeout(scaleStage,80));
document.addEventListener('fullscreenchange',()=>setTimeout(scaleStage,80));
if(window.visualViewport){visualViewport.addEventListener('resize',scaleStage);visualViewport.addEventListener('scroll',scaleStage)}
scaleStage();
function ac(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();return audio}
function tone(freq,d=.08,type='sine',vol=.045,delay=0){try{let a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,a.currentTime+delay);g.gain.setValueAtTime(vol,a.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+delay+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+d)}catch(e){}}
function chord(arr){arr.forEach((f,i)=>tone(f,.25,'sine',.035,i*.03))}
function startGame(mode){state={mode,level:1,score:0,lives:3,hint:3,shuffle:3,bomb:2,selected:null,highlight:[],path:null,bonusFactor:1,remaining:0,grid:[],paused:false,inputLocked:false};document.getElementById('home').classList.remove('active');document.getElementById('game').classList.add('active');setupLevel()}
function levelConfig(){let [r,c,k,t,s]=configs[state.level-1];if(state.mode==='easy'){k=Math.max(6,k-4);t=Math.round(t*1.25)}if(state.mode==='hard'){k=Math.min(34,k+2);t=Math.round(t*.85)}return {r,c,k,t,s}}
function setupLevel(retry=false){clearInterval(timer);state.paused=false;state.inputLocked=false;document.getElementById('pauseOverlay').classList.remove('show');const cf=levelConfig();state.rows=cf.r;state.cols=cf.c;state.shift=cf.s;state.baseTime=cf.t;state.time=Math.round(cf.t*(retry?(state.lives===2?1.1:1.2):1));state.startTime=state.time;state.selected=null;state.path=null;state.highlight=[];generateBoard(cf);updateUI();draw();timer=setInterval(tick,1000)}
function generateBoard(cf){let total=cf.r*cf.c,pairs=total/2,types=shuffleArray(tileKinds.slice()).slice(0,Math.min(cf.k,tileKinds.length));let ids=[SANMEN.id,SANMEN.id];for(let p=1;p<pairs;p++){let k=types[(p-1)%types.length];ids.push(k.id,k.id)}ids=shuffleArray(ids);state.grid=Array.from({length:cf.r+2},()=>Array(cf.c+2).fill(null));let q=0;for(let r=1;r<=cf.r;r++)for(let c=1;c<=cf.c;c++)state.grid[r][c]=ids[q++];state.remaining=total;if(!findOneValidPair()) shuffleRemaining()}
function shuffleArray(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function kind(id){return id==='sanmen'?SANMEN:tileKinds.find(x=>x.id===id)}
function tileGeom(){let pad=12,gap=7,w=(canvas.width-pad*2-gap*(state.cols-1))/state.cols,h=(canvas.height-pad*2-gap*(state.rows-1))/state.rows;return {pad,gap,w,h}}
function pos(r,c){let g=tileGeom();return {x:g.pad+(c-1)*(g.w+g.gap),y:g.pad+(r-1)*(g.h+g.gap),w:g.w,h:g.h}}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);let g=tileGeom();for(let r=1;r<=state.rows;r++)for(let c=1;c<=state.cols;c++){let id=state.grid[r][c];if(!id)continue;drawTile(r,c,id,g)}if(state.path)drawPath(state.path);}

function calligraphyFont(size){return `900 ${size}px "FZKai-Z03","DFKai-SB","BiauKai","STKaiti","KaiTi","Kaiti SC","Noto Serif CJK SC","Noto Serif SC","Songti SC","SimSun",serif`}
function centerText(txt,p,size,color,stroke='#fff8e8',strokeW=4,fontFamily=null){
  ctx.save();
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=fontFamily||calligraphyFont(size);
  ctx.lineJoin='round';ctx.lineCap='round';ctx.miterLimit=2;
  const x=p.x+p.w/2,y=p.y+p.h/2,sw=Math.max(4,strokeW);
  // 外层浅色描边保证字与牌底分离。
  ctx.lineWidth=sw;ctx.strokeStyle=stroke;ctx.strokeText(txt,x,y);
  // 内层同色粗描边 + 多次偏移叠印：即使平板缺少楷体，也能呈现粗壮毛笔感。
  ctx.lineWidth=Math.max(2.2,size*.055);ctx.strokeStyle=color;ctx.strokeText(txt,x,y);
  ctx.fillStyle=color;
  const d=Math.max(.8,size*.018);
  [[0,0],[-d,0],[d,0],[0,-d],[0,d],[-d*.7,-d*.7],[d*.7,d*.7],[-d*.7,d*.7],[d*.7,-d*.7]].forEach(([dx,dy])=>ctx.fillText(txt,x+dx,y+dy));
  ctx.restore();
}
function fitText(txt,p,maxSize,maxWidthRatio=.9,fontMaker=calligraphyFont){

}
function drawVectorGlyph(ch,p,color='#173f78',outline='#fffdf0',pad=.10){
  const g=VECTOR_GLYPHS[ch]; if(!g)return;
  const [x0,y0,x1,y1]=g.b, gw=x1-x0, gh=y1-y0;
  const availW=p.w*(1-pad*2), availH=p.h*(1-pad*2);
  const sc=Math.min(availW/gw,availH/gh);
  const dx=p.x+(p.w-gw*sc)/2-x0*sc;
  const dy=p.y+(p.h+gh*sc)/2+y0*sc;
  const path=new Path2D(g.d);
  ctx.save();ctx.translate(dx,dy);ctx.scale(sc,-sc);ctx.lineJoin='round';ctx.lineCap='round';
  // 固定内置楷书矢量轮廓：完全不依赖平板系统字体。

  ctx.strokeStyle=outline;ctx.lineWidth=62;ctx.stroke(path);
  ctx.strokeStyle=color;ctx.lineWidth=28;ctx.stroke(path);
  ctx.fillStyle=color;ctx.fill(path);
  ctx.restore();
}
function drawWan(p,n){

  const bottom={x:p.x+p.w*.03,y:p.y+p.h*.47,w:p.w*.94,h:p.h*.50};

function drawTong(p,n){
  // 采用传统麻将更易辨认的点位；坐标均为牌面内部比例，保证图案大而不越界。
  const layouts={
    1:[[.50,.50]],
    2:[[.50,.29],[.50,.71]],
    3:[[.50,.20],[.50,.50],[.50,.80]],             // 三筒：竖排
    4:[[.28,.28],[.72,.28],[.28,.72],[.72,.72]],
    5:[[.27,.25],[.73,.25],[.50,.50],[.27,.75],[.73,.75]], // 五筒：梅花形
    6:[[.28,.18],[.72,.18],[.28,.50],[.72,.50],[.28,.82],[.72,.82]],
    7:[[.27,.16],[.73,.16],[.27,.43],[.73,.43],[.50,.57],[.27,.84],[.73,.84]],
    8:[[.28,.12],[.72,.12],[.28,.37],[.72,.37],[.28,.63],[.72,.63],[.28,.88],[.72,.88]],
    9:[[.22,.18],[.50,.18],[.78,.18],[.22,.50],[.50,.50],[.78,.50],[.22,.82],[.50,.82],[.78,.82]]
  };
  const pts=layouts[n];
  const inset=Math.max(4,Math.min(p.w,p.h)*.055);
  const aw=p.w-inset*2, ah=p.h-inset*2;
  // 根据最近两个筒之间的距离动态求最大安全半径。
  let minDist=Infinity;
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    const dx=(pts[i][0]-pts[j][0])*aw,dy=(pts[i][1]-pts[j][1])*ah;
    minDist=Math.min(minDist,Math.hypot(dx,dy));
  }
  let rad=n===1?Math.min(aw,ah)*.34:Math.min(minDist*.39,aw*.22,ah*.16);
  if(n===2||n===3)rad=Math.min(rad,aw*.30); // 竖排时充分利用横向空间
  if(n===5)rad=Math.min(rad,aw*.22,ah*.17);
  pts.forEach(([ux,uy],i)=>{
    const x=p.x+inset+ux*aw,y=p.y+inset+uy*ah;
    // 中心点采用红色，外圈交替绿/蓝，识别更直观。
    let col=(n===5&&i===2)?'#b62525':(i%2===0?'#237840':'#235a9b');
    if(n===1)col='#b62525';
    ctx.save();
    ctx.fillStyle='#fffaf0';ctx.strokeStyle=col;ctx.lineWidth=Math.max(3,rad*.22);
    ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.strokeStyle=col;ctx.lineWidth=Math.max(2,rad*.12);ctx.beginPath();ctx.arc(x,y,rad*.58,0,Math.PI*2);ctx.stroke();
    // 外圈齿纹使用矢量圆点，缩小时仍保持清楚。
    ctx.fillStyle=col;
    for(let a=0;a<8;a++){let ang=a*Math.PI/4;ctx.beginPath();ctx.arc(x+Math.cos(ang)*rad*.78,y+Math.sin(ang)*rad*.78,Math.max(1.3,rad*.085),0,Math.PI*2);ctx.fill()}
    ctx.fillStyle=n===1?'#237840':'#e1bb4d';ctx.beginPath();ctx.arc(x,y,rad*.19,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}
function bamboo(x,y,w,h,color,accent){
  ctx.save();

  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.strokeStyle='#173f2e';ctx.lineWidth=Math.max(3,w*.22);
  ctx.fillStyle=color;roundRect(x-w/2,y-h/2,w,h,w*.42);ctx.fill();ctx.stroke();
  ctx.fillStyle=accent;roundRect(x-w*.20,y-h*.40,w*.18,h*.80,w*.10);ctx.fill();
  ctx.strokeStyle='#f0d36b';ctx.lineWidth=Math.max(3,h*.055);
  [-.18,.18].forEach(t=>{ctx.beginPath();ctx.moveTo(x-w*.48,y+h*t);ctx.lineTo(x+w*.48,y+h*t);ctx.stroke()});
  ctx.fillStyle='#fff1a0';ctx.beginPath();ctx.arc(x-w*.12,y-h*.28,Math.max(1.5,w*.08),0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawPeacock(p){

  ctx.fillStyle='#2879b7';ctx.beginPath();ctx.arc(cx,cy-scale*.21,scale*.095,0,Math.PI*2);ctx.fill();ctx.stroke();

  ctx.strokeStyle='#173f78';ctx.lineWidth=Math.max(2,scale*.028);ctx.beginPath();ctx.moveTo(cx-scale*.035,cy-scale*.30);ctx.lineTo(cx-scale*.11,cy-scale*.40);ctx.moveTo(cx+scale*.035,cy-scale*.30);ctx.lineTo(cx+scale*.11,cy-scale*.40);ctx.stroke();
  ctx.restore();
}
function drawTiao(p,n){
  if(n===1){drawPeacock(p);return}

  const layouts={
    2:[[.34,.50],[.66,.50]],
    3:[[.28,.34],[.50,.66],[.72,.34]],
    4:[[.32,.32],[.68,.32],[.32,.68],[.68,.68]],
    5:[[.30,.27],[.70,.27],[.50,.50],[.30,.73],[.70,.73]],
    6:[[.30,.20],[.70,.20],[.30,.50],[.70,.50],[.30,.80],[.70,.80]],
    7:[[.27,.18],[.50,.18],[.73,.18],[.31,.50],[.69,.50],[.31,.82],[.69,.82]],
    8:[[.29,.16],[.71,.16],[.29,.39],[.71,.39],[.29,.61],[.71,.61],[.29,.84],[.71,.84]],
    9:[[.23,.18],[.50,.18],[.77,.18],[.23,.50],[.50,.50],[.77,.50],[.23,.82],[.50,.82],[.77,.82]]
  };
  const pts=layouts[n], inset=Math.max(5,Math.min(p.w,p.h)*.06),aw=p.w-inset*2,ah=p.h-inset*2;

}
function drawZi(p,n){

function selectTile(r,c){if(state.paused||state.inputLocked||state.time<=0)return;tone(450);state.highlight=[];if(!state.selected){state.selected={r,c};draw();return}let a=state.selected,b={r,c};if(a.r===r&&a.c===c){state.selected=null;draw();return}if(state.grid[a.r][a.c]===state.grid[b.r][b.c]){let path=findPath(a,b);if(path){state.path=path;draw();setTimeout(()=>removePair(a,b),180);return}}tone(160,.18,'sawtooth',.04);state.selected=b;draw()}
function findPath(a,b){let R=state.rows+2,C=state.cols+2;if(state.grid[a.r][a.c]!==state.grid[b.r][b.c])return null;let dirs=[[1,0],[-1,0],[0,1],[0,-1]],q=[{r:a.r,c:a.c,d:-1,t:0,path:[a]}],best=Array.from({length:R},()=>Array.from({length:C},()=>[9,9,9,9]));while(q.length){let s=q.shift();for(let nd=0;nd<4;nd++){let nt=s.d<0?s.t:s.t+(s.d!==nd?1:0);if(nt>2)continue;let rr=s.r+dirs[nd][0],cc=s.c+dirs[nd][1];if(rr<0||cc<0||rr>=R||cc>=C)continue;if(!(rr===b.r&&cc===b.c)&&state.grid[rr][cc])continue;if(rr===b.r&&cc===b.c){return compressPath([...s.path,b])}if(best[rr][cc][nd]<=nt)continue;best[rr][cc][nd]=nt;q.push({r:rr,c:cc,d:nd,t:nt,path:[...s.path,{r:rr,c:cc}]})}}return null}

function removePair(a,b){if(state.paused||state.inputLocked||state.time<=0){state.selected=null;state.path=null;draw();return;}let id=state.grid[a.r][a.c];state.grid[a.r][a.c]=state.grid[b.r][b.c]=null;state.remaining-=2;state.selected=null;state.path=null;let gain=100;if(id==='sanmen'){gain+=state.time*20;showBanner(`✨ 三门早消奖励 +${gain} ✨`);chord([523,659,784,1047,1319])}else chord([523,659,784]);state.score+=gain;if(state.shift)applyShift(state.shift);updateUI();draw();if(state.remaining===0)return levelWin();if(!findOneValidPair()){showBanner('没有可连的牌，已自动重排');setTimeout(shuffleRemaining,500)}}
function applyShift(s){if(s===1||s===2){for(let c=1;c<=state.cols;c++){let vals=[];for(let r=1;r<=state.rows;r++)if(state.grid[r][c])vals.push(state.grid[r][c]);for(let r=1;r<=state.rows;r++)state.grid[r][c]=null;if(s===1)vals.forEach((v,i)=>state.grid[state.rows-vals.length+1+i][c]=v);else vals.forEach((v,i)=>state.grid[1+i][c]=v)}}else{for(let r=1;r<=state.rows;r++){let vals=[];for(let c=1;c<=state.cols;c++)if(state.grid[r][c])vals.push(state.grid[r][c]);for(let c=1;c<=state.cols;c++)state.grid[r][c]=null;if(s===3)vals.forEach((v,i)=>state.grid[r][1+i]=v);else vals.forEach((v,i)=>state.grid[r][state.cols-vals.length+1+i]=v)}}}

function useShuffle(){if(state.paused||state.inputLocked||state.time<=0)return;if(state.shuffle<=0)return;state.shuffle--;shuffleRemaining();updateUI();showBanner('🔀 已重排，保证至少有一对可消除')}
function useBomb(){if(state.paused||state.inputLocked||state.time<=0)return;if(state.bomb<=0)return;let p=findOneValidPair();if(!p)return;state.bomb--;updateUI();removePair(p[0],p[1]);showBanner('💣 已帮您直接消除一对')}
function tick(){if(state.paused)return;state.time--;updateUI();if(state.time<=0){state.time=0;state.inputLocked=true;state.selected=null;state.highlight=[];state.path=null;clearInterval(timer);timer=null;updateUI();draw();state.lives--;tone(120,.5,'sawtooth',.05);if(state.lives>0){let more=state.lives===2?'下次时间增加 10%':'最后一次机会，时间增加 20%';showMessage(`本次时间到了。<br>别着急，牌局可以重新开始。<br><span style="color:#a52b2b">${more}</span>`,[{t:'再试一次',c:'primary',f:()=>{hideMessage();setupLevel(true)}},{t:'返回首页',c:'secondary',f:goHome}])}else{saveRank();showMessage(`本轮挑战结束。<br>您的得分：<span style="color:#174a7e;font-size:36px">${state.score}</span><br>已经自动记录到本机排行榜。`,[{t:'回到首页',c:'primary',f:goHome},{t:'查看排行榜',c:'secondary',f:()=>{hideMessage();showRanks()}}])}}}
function prepareNextLevel(andRest=false){
  hideMessage();
  state.level++;
  // 简单、普通：每关恢复3次机会；困难：整局共享当前剩余机会。
  if(state.mode!=='hard') state.lives=3;
  state.hint=3;state.shuffle=3;state.bomb=2;
  setupLevel();
  if(andRest){
    pauseGame();
    document.querySelector('#pauseBox .pauseTitle').textContent='休息一下';
    document.querySelector('#pauseBox .pauseNote').innerHTML='下一关已经准备好了。<br>倒计时尚未开始，休息好再继续。';
  }
}
function levelWin(){clearInterval(timer);state.score+=state.time*5;chord([523,659,784,1047]);if(state.level>=20){saveRank();showMessage(`🎉 恭喜您完成全部 20 关！<br>最终得分：<span style="font-size:38px;color:#174a7e">${state.score}</span>`,[{t:'返回首页',c:'primary',f:goHome},{t:'看排行榜',c:'secondary',f:()=>{hideMessage();showRanks()}}]);return}showMessage(`✅ 第 ${state.level} 关完成！<br>剩余时间奖励：+${state.time*5} 分`,[{t:'继续下一关',c:'primary',f:()=>prepareNextLevel(false)},{t:'休息一下',c:'secondary',f:()=>prepareNextLevel(true)}])}
function updateUI(){document.getElementById('levelText').textContent=state.level;document.getElementById('scoreText').textContent=state.score;document.getElementById('timeText').textContent=state.time;let pct=Math.max(0,Math.min(100,state.time/Math.max(1,state.startTime||state.baseTime)*100));document.getElementById('timeFill').style.width=pct+'%';document.getElementById('timeStat').classList.toggle('low',pct<=22);document.getElementById('lifeText').textContent='❤️'.repeat(state.lives)+'🤍'.repeat(3-state.lives);document.getElementById('hintCount').textContent='×'+state.hint;document.getElementById('shuffleCount').textContent='×'+state.shuffle;document.getElementById('bombCount').textContent='×'+state.bomb;document.getElementById('hintBtn').disabled=state.hint<=0||state.inputLocked;document.getElementById('shuffleBtn').disabled=state.shuffle<=0||state.inputLocked;document.getElementById('bombBtn').disabled=state.bomb<=0||state.inputLocked;document.getElementById('modeText').textContent={easy:'简单难度',normal:'普通难度',hard:'困难难度 · 全局3次机会'}[state.mode];document.getElementById('shiftText').textContent=['本关：固定牌阵','本关：向下掉落','本关：向上吸附','本关：向左滑动','本关：向右滑动'][state.shift||0]}
function showBanner(t){let b=document.getElementById('banner');b.textContent=t;b.style.display='block';clearTimeout(b._t);b._t=setTimeout(()=>b.style.display='none',1800)}
function showMessage(html,buttons){let m=document.getElementById('message');m.innerHTML=html+'<div class="msgBtns"></div>';let row=m.querySelector('.msgBtns');buttons.forEach(x=>{let b=document.createElement('button');b.textContent=x.t;b.className=x.c;b.onclick=x.f;row.appendChild(b)});m.style.display='block'}function hideMessage(){document.getElementById('message').style.display='none'}
function pauseGame(){
  if(state.paused||!document.getElementById('game').classList.contains('active'))return;
  state.paused=true;clearInterval(timer);timer=null;state.selected=null;state.highlight=[];draw();
  document.querySelector('#pauseBox .pauseTitle').textContent='游戏已暂停';
  document.querySelector('#pauseBox .pauseNote').innerHTML='倒计时已经停止。<br>休息好了，再继续慢慢玩。';
  document.getElementById('pauseOverlay').classList.add('show');
}
function resumeGame(){
  if(!state.paused)return;state.paused=false;document.getElementById('pauseOverlay').classList.remove('show');
  clearInterval(timer);timer=setInterval(tick,1000);
}
function confirmHome(){if(state.paused)return;clearInterval(timer);showMessage('确定要返回首页吗？<br>当前这一局不会保存进度。',[{t:'继续玩',c:'primary',f:()=>{hideMessage();timer=setInterval(tick,1000)}},{t:'返回首页',c:'secondary',f:goHome}])}
function goHome(){clearInterval(timer);hideMessage();document.getElementById('game').classList.remove('active');document.getElementById('home').classList.add('active')}
async function toggleFullscreen(){
  try{
    if(!document.fullscreenElement){
      const target=document.documentElement;
      if(target.requestFullscreen) await target.requestFullscreen();
      else if(target.webkitRequestFullscreen) target.webkitRequestFullscreen();
    }else{
      if(document.exitFullscreen) await document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }catch(e){}
  setTimeout(scaleStage,100);
}
function saveRank(){let key='bama_lianliankan_ranks',arr=JSON.parse(localStorage.getItem(key)||'[]');arr.push({score:state.score,level:state.level,diff:{easy:'简单',normal:'普通',hard:'困难'}[state.mode],date:new Date().toLocaleDateString('zh-CN')});arr.sort((a,b)=>b.score-a.score);localStorage.setItem(key,JSON.stringify(arr.slice(0,10)))}
function showRanks(){let arr=JSON.parse(localStorage.getItem('bama_lianliankan_ranks')||'[]'),tb=document.getElementById('rankBody');tb.innerHTML=arr.length?arr.map((x,i)=>`<tr><td>${i+1}</td><td>${x.score}</td><td>${x.level}</td><td>${x.diff}</td><td>${x.date}</td></tr>`).join(''):'<tr><td colspan="5">还没有成绩，来玩第一局吧！</td></tr>';document.getElementById('rankPanel').style.display='block'}function hideRanks(){document.getElementById('rankPanel').style.display='none'}
</script>
</body>
</html>
