<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>核销员管理</title>
<style>body{font:16px system-ui;background:#f0e8db;color:#493929;max-width:900px;margin:auto;padding:20px}section{background:white;padding:20px;border-radius:18px;margin:16px 0}input,button{font:inherit;padding:12px;margin:5px;border:1px solid #ccc;border-radius:8px}button{background:#306a58;color:white;cursor:pointer}#rows>div{padding:12px;border-bottom:1px solid #ddd}#msg{color:#a33}.integrated{background:#18221f;color:#edf3ef;padding:8px;max-width:none}.integrated>h1,.integrated>a,.integrated #auth{display:none!important}.integrated section{background:#202d29}.integrated input{background:#111916;color:#edf3ef;border-color:#4b6055}.integrated #msg{color:#f0b19e}input{box-sizing:border-box;max-width:100%}</style>
<h1>核销员管理</h1><a href="/admin/lottery">返回抽奖管理</a> · <a href="/redeem">手机核销后台</a>
<section id="auth"><input id="adminPassword" type="password" placeholder="管理员密码"><button id="login">登录</button></section>
<section><h2>新增 / 编辑核销员</h2><p>编辑时密码留空则保留原密码。停用或修改后，原登录会立即失效。</p><input id="account" placeholder="账号（字母、数字）" autocomplete="off"><input id="password" type="password" placeholder="密码，至少8位" autocomplete="new-password"><input id="name" placeholder="姓名"><input id="phone" type="tel" placeholder="手机号"><label><input id="enabled" type="checkbox" checked>启用</label><button id="save">保存</button><button id="new">新增</button><p id="msg"></p></section><section id="rows"></section>
<script>
if(window.parent!==window)document.body.classList.add('integrated');
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('pn_admin_token')||(window.parent===window?localStorage.getItem('ponan_admin_token'):'')||'',editing='';
async function api(method,data){const r=await fetch('/api/admin/redeemers',{method,headers:{'content-type':'application/json',Authorization:'Bearer '+token},body:data?JSON.stringify(data):undefined});const b=await r.json();if(!r.ok){if(r.status===401&&window.parent!==window)window.parent.postMessage('ponan-admin-expired',location.origin);throw Error(b.error);}return b;}
function clear(){editing='';['account','password','name','phone'].forEach(k=>$(k).value='');$('enabled').checked=true;}
async function load(){try{const b=await api('GET');$('auth').hidden=true;$('rows').textContent='';b.items.forEach(a=>{const d=document.createElement('div'),t=document.createElement('span'),btn=document.createElement('button');t.textContent=a.name+' · '+a.account+' · '+a.phone+' · '+(a.enabled?'启用':'已停用');btn.textContent='编辑';btn.onclick=()=>{editing=a.id;['account','name','phone'].forEach(k=>$(k).value=a[k]);$('password').value='';$('enabled').checked=a.enabled;window.scrollTo(0,0)};d.append(t,btn);$('rows').append(d)})}catch(e){$('msg').textContent=e.message;$('auth').hidden=false;}}
$('login').onclick=async()=>{try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('adminPassword').value})}),b=await r.json();if(!r.ok)throw Error(b.error);token=b.token;localStorage.setItem('ponan_admin_token',token);load()}catch(e){$('msg').textContent=e.message}};
$('save').onclick=async()=>{try{await api('POST',{id:editing||undefined,account:$('account').value,password:$('password').value,name:$('name').value,phone:$('phone').value,enabled:$('enabled').checked});clear();await load();$('msg').textContent='已保存'}catch(e){$('msg').textContent=e.message}};$('new').onclick=clear;if(token)load();
</script></html>
