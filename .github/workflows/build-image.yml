# 在 GitHub 上构建镜像并推送到 CNB 镜像仓库（docker.cnb.cool），
# 构建成功后通知服务器上的 Coolify 拉取新镜像并部署。
# 需要在仓库 Settings → Secrets and variables → Actions 中配置 CNB_TOKEN 和 COOLIFY_TOKEN。
name: Build image to CNB

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.cnb.cool
  IMAGE: docker.cnb.cool/wzpytanhua/wx-pnxbj/app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to CNB registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl -fsS -X POST --retry 3 --max-time 60 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "https://coolify.wzpy.net/api/v1/deploy?uuid=6letqxmuonzjmu0p9e34jcpj&force=false"
