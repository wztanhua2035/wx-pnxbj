<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>坡南礼遇 · 核销工作台</title>
<style>*{box-sizing:border-box}body{font:16px system-ui;background:#173c35;color:#263c32;margin:0;padding:20px 14px;max-width:560px;margin:auto}h1{color:#ffe0a0;font-size:27px}section{background:#fffaf0;border-radius:20px;padding:20px;margin:16px 0}input,button{width:100%;font:inherit;border-radius:12px;padding:14px;margin:7px 0;border:1px solid #c5b598}button{background:#326b58;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#86633f}#msg{color:#ffdfaa;min-height:24px}video{width:100%;border-radius:12px}#ticket h2{color:#8d4b21}.stamp{color:#ac302b;font-size:28px;font-weight:900}a{color:#eee}</style>
<h1>坡南礼遇 · 核销工作台</h1><section id="loginBox"><input id="account" autocomplete="username" placeholder="核销员账号"><input id="password" autocomplete="current-password" type="password" placeholder="密码"><button id="login">登录</button></section>
<section id="work" hidden><div id="who"></div><input id="code" inputmode="numeric" maxlength="8" placeholder="输入8位兑奖码"><button id="query">查询奖券</button><button id="scan" class="secondary">摄像头扫码</button><label>拍照 / 从相册识别二维码<input id="photo" type="file" accept="image/*"></label><video id="video" hidden playsinline muted></video><button id="stop" hidden>停止扫码</button><button id="logout" class="secondary">退出登录</button></section>
<p id="msg"></p><section id="ticket" hidden></section><canvas id="canvas" hidden></canvas><script src="/vendor/jsQR.js"></script>
<script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('ponan_redeemer')||'',stream=null,ticket=null,busy=false,scanGeneration=0;
function show(){ $('loginBox').hidden=!!token;$('work').hidden=!token;$('who').textContent='核销员：'+(sessionStorage.getItem('ponan_redeemer_name')||''); }
async function api(path,body){const r=await fetch('/api/redeemer/'+path,{method:body?'POST':'GET',headers:{'content-type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined}),b=await r.json();if(!r.ok){if(r.status===401){token='';sessionStorage.removeItem('ponan_redeemer');show();stop();}throw Error(b.error||'请求失败')}return b;}
function stop(){scanGeneration++;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('video').hidden=true;$('stop').hidden=true;}
function display(){const box=$('ticket');box.textContent='';if(!ticket){box.hidden=true;return}box.hidden=false;const title=document.createElement('h2'),desc=document.createElement('p'),state=document.createElement('p');title.textContent=ticket.prizeName;desc.textContent='兑奖码：'+ticket.code+(ticket.note?' · '+ticket.note:'');state.textContent=ticket.invalid?'无效 · 调试奖券':ticket.redeemed?'已领 · 请勿重复发奖':'待领取';state.className='stamp';box.append(title,desc,state);if(!ticket.invalid&&!ticket.redeemed){const b=document.createElement('button');b.textContent='确认发奖并核销';b.onclick=async()=>{if(busy||!confirm('确认已核对奖品并发给玩家？'))return;busy=true;b.disabled=true;try{const r=await api('redeem',{code:ticket.code});ticket=r.ticket;display();$('msg').textContent=r.alreadyRedeemed?'此前已核销，请勿重复发奖':'核销成功'}catch(e){$('msg').textContent=e.message}finally{busy=false;b.disabled=false}};box.append(b)}}
async function query(value){if(busy)return;ticket=null;display();const code=String(value||$('code').value).trim();if(!/^\d{8}$/.test(code)){$('msg').textContent='请输入8位数字兑奖码';return}busy=true;$('code').value=code;try{const r=await api('ticket?code='+code);ticket=r.ticket;display();$('msg').textContent='请核对奖品后点击确认核销'}catch(e){$('msg').textContent=e.message}finally{busy=false}}
$('login').onclick=async()=>{try{const r=await api('login',{account:$('account').value,password:$('password').value});token=r.token;sessionStorage.setItem('ponan_redeemer',token);sessionStorage.setItem('ponan_redeemer_name',r.name);$('password').value='';$('msg').textContent='';show()}catch(e){$('msg').textContent=e.message}};
$('logout').onclick=()=>{stop();token='';ticket=null;sessionStorage.removeItem('ponan_redeemer');sessionStorage.removeItem('ponan_redeemer_name');display();show()};$('query').onclick=()=>query();$('stop').onclick=stop;
function decode(source,w,h){const c=$('canvas'),scale=Math.min(1,1000/Math.max(w,h));c.width=Math.round(w*scale);c.height=Math.round(h*scale);const ctx=c.getContext('2d');ctx.drawImage(source,0,0,c.width,c.height);return jsQR(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height)}
$('scan').onclick=async()=>{stop();ticket=null;display();const generation=scanGeneration;try{if(!navigator.mediaDevices)throw Error('当前浏览器不支持摄像头，请使用拍照或相册识别');const incoming=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(generation!==scanGeneration){incoming.getTracks().forEach(t=>t.stop());return}stream=incoming;const v=$('video');v.srcObject=stream;v.hidden=false;$('stop').hidden=false;await v.play();$('msg').textContent='请将奖券二维码对准摄像头';function tick(){if(generation!==scanGeneration||!stream)return;if(v.readyState>=2){const r=decode(v,v.videoWidth,v.videoHeight);if(r&&/^\d{8}$/.test(r.data)){stop();query(r.data);return}}setTimeout(tick,150)}tick()}catch(e){stop();$('msg').textContent=e.message+'；可使用下方相册识别'}};
$('photo').onchange=()=>{stop();const file=$('photo').files[0];if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const r=decode(img,img.width,img.height);if(!r||!/^\d{8}$/.test(r.data))throw Error('未识别到有效兑奖码，请靠近二维码重新拍摄');query(r.data)}catch(e){$('msg').textContent=e.message}finally{URL.revokeObjectURL(url);$('photo').value=''}};img.onerror=()=>{URL.revokeObjectURL(url);$('msg').textContent='图片无法读取'};img.src=url};window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});show();
</script></html>
